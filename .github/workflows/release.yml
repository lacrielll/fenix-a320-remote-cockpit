name: Build and release Windows installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $releaseVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Tag must use a version such as v0.1.0 or v0.1.0-alpha.1"
          }
          "value=$releaseVersion" >> $env:GITHUB_OUTPUT
          "numeric=$($releaseVersion.Split('-')[0])" >> $env:GITHUB_OUTPUT

      - name: Install web dependencies
        run: npm ci

      - name: Build web interface
        run: npm run build

      - name: Publish Windows bridge with private runtime
        shell: pwsh
        run: |
          dotnet publish bridge/A320Boards.Bridge/A320Boards.Bridge.csproj `
            --configuration Release `
            --self-contained false `
            -p:UseAppHost=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=${{ steps.version.outputs.value }} `
            --output release-staging/publish/bridge
          Copy-Item -LiteralPath dist -Destination release-staging/publish/bridge/web -Recurse

          $dotnetExe = (Get-Command dotnet).Source
          $dotnetRoot = Split-Path $dotnetExe
          $runtimeVersion = dotnet --list-runtimes |
            Where-Object { $_ -match '^Microsoft\.NETCore\.App 8\.' } |
            ForEach-Object { [regex]::Match($_, '^Microsoft\.NETCore\.App ([^ ]+)').Groups[1].Value } |
            Sort-Object { [version]$_ } -Descending |
            Select-Object -First 1
          $fxrVersion = Get-ChildItem -LiteralPath (Join-Path $dotnetRoot 'host/fxr') -Directory |
            Where-Object { $_.Name -like '8.*' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1 -ExpandProperty Name
          if (-not $runtimeVersion -or -not $fxrVersion) { throw 'The .NET 8 runtime layout was not found on the runner.' }

          $privateRuntime = New-Item -ItemType Directory -Force release-staging/publish/runtime
          Copy-Item -LiteralPath $dotnetExe -Destination $privateRuntime.FullName
          New-Item -ItemType Directory -Force "$($privateRuntime.FullName)/host/fxr" | Out-Null
          Copy-Item -LiteralPath (Join-Path $dotnetRoot "host/fxr/$fxrVersion") -Destination "$($privateRuntime.FullName)/host/fxr/$fxrVersion" -Recurse
          New-Item -ItemType Directory -Force "$($privateRuntime.FullName)/shared/Microsoft.NETCore.App" | Out-Null
          Copy-Item -LiteralPath (Join-Path $dotnetRoot "shared/Microsoft.NETCore.App/$runtimeVersion") -Destination "$($privateRuntime.FullName)/shared/Microsoft.NETCore.App/$runtimeVersion" -Recurse
          foreach ($notice in @('LICENSE.txt', 'ThirdPartyNotices.txt')) {
            $noticePath = Join-Path $dotnetRoot $notice
            if (Test-Path -LiteralPath $noticePath) { Copy-Item -LiteralPath $noticePath -Destination $privateRuntime.FullName }
          }

          # SimConnect's managed C++ wrapper requires the current x64 VC++
          # runtime. Bundle Microsoft's redistributable so clean PCs work too.
          New-Item -ItemType Directory -Force release-staging/publish/prerequisites | Out-Null
          Invoke-WebRequest `
            -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' `
            -OutFile release-staging/publish/prerequisites/VC_redist.x64.exe

      - name: Smoke-test packaged bridge and cockpit artwork
        shell: pwsh
        run: |
          $publish = (Resolve-Path release-staging/publish).Path
          $bridge = Join-Path $publish 'bridge'
          foreach ($required in @(
            'A320Boards.Bridge.dll',
            'Microsoft.FlightSimulator.SimConnect.dll',
            'SimConnect.dll',
            'web/index.html'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $bridge $required) -PathType Leaf)) {
              throw "Required packaged file is missing: $required"
            }
          }
          if (Test-Path -LiteralPath (Join-Path $bridge 'lib/SimConnect.dll')) {
            throw 'Native SimConnect.dll was packaged in bridge/lib instead of beside the bridge assembly.'
          }

          $layout = Get-ChildItem (Join-Path $bridge 'web/assets') -Filter 'cockpit-layout-*.svg' -File
          $background = Get-ChildItem (Join-Path $bridge 'web/assets') -Filter 'airport-background-*.jpg' -File
          if ($layout.Count -ne 1 -or $background.Count -ne 1) {
            throw "Cockpit web artwork is incomplete (layouts=$($layout.Count), backgrounds=$($background.Count))."
          }

          $stdout = Join-Path $env:RUNNER_TEMP 'bridge-smoke.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'bridge-smoke.stderr.log'
          $dotnet = Join-Path $publish 'runtime/dotnet.exe'
          $process = Start-Process -FilePath $dotnet `
            -ArgumentList @('exec', (Join-Path $bridge 'A320Boards.Bridge.dll'), '--no-browser', '--read-only', '--probe-seconds', '30', '--port', '8399') `
            -WorkingDirectory $publish -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($process.HasExited) { break }
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:8399/health' -TimeoutSec 1
                if ($health.ok) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 200
            }
            if (-not $ready) {
              throw "Packaged bridge did not become healthy.`nSTDOUT:`n$(Get-Content $stdout -Raw -ErrorAction SilentlyContinue)`nSTDERR:`n$(Get-Content $stderr -Raw -ErrorAction SilentlyContinue)"
            }
            $layoutResponse = Invoke-WebRequest "http://127.0.0.1:8399/assets/$($layout.Name)" -TimeoutSec 5 -UseBasicParsing
            $backgroundResponse = Invoke-WebRequest "http://127.0.0.1:8399/assets/$($background.Name)" -TimeoutSec 5 -UseBasicParsing
            if ($layoutResponse.StatusCode -ne 200 -or $layoutResponse.Content.Length -lt 1000) { throw 'Packaged cockpit SVG could not be served.' }
            if ($backgroundResponse.StatusCode -ne 200 -or $backgroundResponse.RawContentLength -lt 1000) { throw 'Packaged cockpit background could not be served.' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "Inno Setup compiler was not found: $iscc" }
          New-Item -ItemType Directory -Force release-staging/installer | Out-Null
          & $iscc `
            "/DMyAppVersion=${{ steps.version.outputs.value }}" `
            "/DMyNumericVersion=${{ steps.version.outputs.numeric }}" `
            "/DPublishDir=$((Resolve-Path release-staging/publish).Path)" `
            "/DOutputDir=$((Resolve-Path release-staging/installer).Path)" `
            installer/FenixRemoteCockpit.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Create checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem release-staging/installer/Fenix-A320-Remote-Cockpit-*-Setup.exe -File | Select-Object -First 1
          if ($null -eq $installer) { throw 'Installer output was not found.' }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-staging/installer/Fenix-A320-Remote-Cockpit-*-Setup.exe
            release-staging/installer/Fenix-A320-Remote-Cockpit-*-Setup.exe.sha256
